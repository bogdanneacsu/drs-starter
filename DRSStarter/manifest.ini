[ABOUT]
NAME = DRS Starter
AUTHOR = Digital Rally Series
VERSION = 0.3.0
DESCRIPTION = DRS Starter: aliniere la linia de start, încălzirea anvelopelor până la start, interfață minimizată în manșă; mod LIVE sincronizat cu Race Control.
; Țintă: CSP 0.3.1 public (build 4302, de confirmat). Pragul de mai jos este cel mai mare folosit de aplicațiile
; oficiale CSP de la care provin API-urile; aplicația avertizează în overlay dacă build-ul diferă de cel aprobat.
REQUIRED_VERSION = 3442

[CORE]
LAZY = NONE  ; rulează cât timp AC este pornit (countdown și aliniere continuă și cu fereastra închisă)

[WINDOW_...]
ID = main
NAME = DRS Starter
ICON = icon.png
FUNCTION_MAIN = windowMain
FUNCTION_SETTINGS = windowSettings
FLAGS = SETTINGS, NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
PADDING = 0, 0
; 760×446 include panoul „Exemplu poziție”; fără el, conținutul ocupă 760×346
SIZE = 760, 446
MIN_SIZE = 456, 268

[RENDER_CALLBACKS]
TRANSPARENT = draw3D
